# Render Blueprint — one-click deploy for the Attorney Roadmap API + Postgres.
# Push to GitHub, then on Render: "New" → "Blueprint" → point to this repo.
services:
  - type: web
    name: attorney-roadmap-api
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: DATABASE_URL
        fromDatabase:
          name: attorney-roadmap-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false   # set this in the Render dashboard to your deployed frontend URL
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: attorney-roadmap-db
    plan: free
    databaseName: attorney_roadmap
    user: attorney_roadmap
